      - name: Copy detection firewall logs
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall
          if [ -d /tmp/gh-aw/sandbox/firewall/logs ]; then mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall/logs && cp -r /tmp/gh-aw/sandbox/firewall/logs/. /tmp/gh-aw/threat-detection/sandbox/firewall/logs/; fi
          if [ -d /tmp/gh-aw/sandbox/firewall/audit ]; then mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall/audit && cp -r /tmp/gh-aw/sandbox/firewall/audit/. /tmp/gh-aw/threat-detection/sandbox/firewall/audit/; fi
      - name: Parse threat detection token usage for step summary
        id: parse_detection_token_usage
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_TOKEN_USAGE_SUMMARY_TITLE: Threat Detection Token Usage
          GH_AW_AGENT_USAGE_PATH: /tmp/gh-aw/threat-detection/detection_usage.json
          GH_AW_AGENT_USAGE_JSONL_PATH: /tmp/gh-aw/threat-detection/detection_usage.jsonl
          GH_AW_WRITE_EMPTY_USAGE: "true"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'parse_token_usage.cjs'));
            await main();
      - name: Upload threat detection artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detection
          path: |
            /tmp/gh-aw/threat-detection/detection_result.json
            /tmp/gh-aw/threat-detection/execution.json
            /tmp/gh-aw/threat-detection/detection_usage.json
            /tmp/gh-aw/threat-detection/detection_usage.jsonl
            /tmp/gh-aw/threat-detection/sandbox/firewall/logs/
            /tmp/gh-aw/threat-detection/sandbox/firewall/audit/
          if-no-files-found: ignore
      - name: Conclude threat detection
        id: detection_conclusion
        if: always()
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          THREAT_DETECT_INSTALL_OUTCOME: ${{ steps.threat_detect_install.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "false"
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/conclude_threat_detection.sh" /tmp/gh-aw/threat-detection/detection_result.json

  pre_activation:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_membership.outputs.is_team_member == 'true' }}
      check_result: ${{ steps.check.outcome }}
      matched_command: ''
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@a65c3ae1e11016c37f426bb3847a6f5e1a7d58df # v0.90.0
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Repo Assist"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/repo-assist.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "2.1.273"
          GH_AW_INFO_AWF_VERSION: "v0.28.27"
          GH_AW_INFO_ENGINE_ID: "claude"
      - name: Check team membership for workflow
        id: check_membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REQUIRED_ROLES: "admin,maintainer,write"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'check_membership.cjs'));
            await main();
      - name: Check authentication, backlog, and duplicate installations
        id: check
        run: |
          if [[ "$GITHUB_REPOSITORY" != "Artic0din/Prismarr" ]]; then
            echo "Repo Assist: Only Artic0din/Prismarr is authorized. No action taken."
            exit 1
          fi
          if ! gh auth status; then
            echo "Repo Assist: gh CLI is not authenticated in this environment. No action taken."
            exit 1
          fi
          gh repo view "$GITHUB_REPOSITORY" --json nameWithOwner,defaultBranchRef,visibility
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 8 \
            --label repo-assist --search 'in:title "[repo-assist]"' --json number --jq 'length')
          if [[ "$count" -ge 8 ]]; then
            echo "Repo Assist: 8 or more open [repo-assist] PRs. Skipping this run to avoid backlog."
            exit 1
          fi
          duplicates=$(gh workflow list --repo "$GITHUB_REPOSITORY" --all --limit 1000 \
            --json name,path,state --jq '[.[] | select(.state == "active" and
            ((.path | startswith(".github/workflows/repo-assist")) or
            (.name | test("repo[ _-]?assist"; "i"))) and
            .path != ".github/workflows/repo-assist.lock.yml")] | length')
          if [[ "$duplicates" -gt 0 ]]; then
            echo "Repo Assist: another Repo Assist workflow is enabled. No action taken."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  safe_outputs:
    needs:
      - activation
      - agent
      - detection
      - validate_updates
    if: >
      ((!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success') &&
      (needs.agent.result == 'success' &&
      needs.validate_updates.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/repo-assist"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_ENGINE_ID: "claude"
      GH_AW_ENGINE_MODEL: "claude-sonnet-4-6"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_ID: "repo-assist"
      GH_AW_WORKFLOW_NAME: "Repo Assist"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/repo-assist.md"
    outputs:
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      comment_id: ${{ steps.process_safe_outputs.outputs.comment_id }}
      comment_url: ${{ steps.process_safe_outputs.outputs.comment_url }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      created_issue_number: ${{ steps.process_safe_outputs.outputs.created_issue_number }}
      created_issue_url: ${{ steps.process_safe_outputs.outputs.created_issue_url }}
      created_pr_number: ${{ steps.process_safe_outputs.outputs.created_pr_number }}
      created_pr_url: ${{ steps.process_safe_outputs.outputs.created_pr_url }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      push_commit_sha: ${{ steps.process_safe_outputs.outputs.push_commit_sha }}
      push_commit_url: ${{ steps.process_safe_outputs.outputs.push_commit_url }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@a65c3ae1e11016c37f426bb3847a6f5e1a7d58df # v0.90.0
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Repo Assist"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/repo-assist.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "2.1.273"
          GH_AW_INFO_AWF_VERSION: "v0.28.27"
          GH_AW_INFO_ENGINE_ID: "claude"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download patch artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: /tmp/gh-aw/
      - name: Checkout repository
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.REPO_ASSIST_GITHUB_TOKEN }}
      - name: Fetch additional refs
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        env:
          GH_AW_FETCH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          header=$(printf "x-access-token:%s" "${GH_AW_FETCH_TOKEN}" | base64 -w 0)
          git -c "http.extraheader=Authorization: Basic ${header}" fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Configure Git credentials
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GIT_TOKEN: ${{ secrets.REPO_ASSIST_GITHUB_TOKEN }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "*.githubusercontent.com,*.pythonhosted.org,anaconda.org,api.npms.io,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,binstar.org,bootstrap.pypa.io,bun.sh,cdn.jsdelivr.net,codeload.github.com,conda.anaconda.org,conda.binstar.org,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,deb.nodesource.com,deno.land,docs.github.com,esm.sh,files.pythonhosted.org,get.pnpm.io,github-cloud.githubusercontent.com,github-cloud.s3.amazonaws.com,github.blog,github.com,github.githubassets.com,go.dev,golang.org,googleapis.deno.dev,googlechromelabs.github.io,goproxy.io,json-schema.org,json.schemastore.org,jsr.io,keyserver.ubuntu.com,lfs.github.com,nodejs.org,npm.pkg.github.com,npmjs.com,npmjs.org,objects.githubusercontent.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,patch-diff.githubusercontent.com,patchdiff.githubusercontent.com,pip.pypa.io,pkg.go.dev,ppa.launchpad.net,proxy.golang.org,pypi.org,pypi.python.org,raw.githubusercontent.com,registry.bower.io,registry.npmjs.com,registry.npmjs.org,registry.yarnpkg.com,repo.anaconda.com,repo.continuum.io,repo.yarnpkg.com,s.symcb.com,s.symcd.com,security.ubuntu.com,skimdb.npmjs.com,storage.googleapis.com,sum.golang.org,telemetry.vercel.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com,www.npmjs.com,www.npmjs.org,yarnpkg.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"add_comment\":{\"max\":10,\"target\":\"*\"},\"add_labels\":{\"allowed\":[\"bug\",\"documentation\",\"duplicate\",\"enhancement\",\"good first issue\",\"help wanted\",\"invalid\",\"question\",\"wontfix\",\"needs-triage\",\"needs-info\",\"ready-for-agent\",\"ready-for-human\"],\"max\":30,\"target\":\"*\"},\"close_issue\":{\"max\":1,\"required_labels\":[\"repo-assist\"],\"required_title_prefix\":\"[repo-assist] Monthly Activity \",\"target\":\"*\"},\"create_issue\":{\"labels\":[\"repo-assist\"],\"max\":4,\"title_prefix\":\"[repo-assist] \"},\"create_pull_request\":{\"allowed_branches\":[\"repo-assist/*\"],\"allowed_files\":[\"README.md\",\"CHANGELOG.md\",\"docs/*.md\",\"docs/**/*.md\"],\"base_branch\":\"main\",\"draft\":false,\"fallback_as_issue\":false,\"labels\":[\"automation\",\"repo-assist\"],\"max\":4,\"max_patch_files\":100,\"max_patch_size\":4096,\"preserve_branch_name\":true,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"CLAUDE.md\",\"AGENTS.md\"],\"protected_files_policy\":\"request-review\",\"stacked\":false},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":2,\"report-as-issue\":\"false\"},\"push_to_pull_request_branch\":{\"allowed_files\":[\"README.md\",\"CHANGELOG.md\",\"docs/*.md\",\"docs/**/*.md\"],\"fallback_as_pull_request\":false,\"if_no_changes\":\"warn\",\"max\":4,\"max_patch_size\":4096,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"CLAUDE.md\",\"AGENTS.md\"],\"protected_files_policy\":\"allowed\",\"required_labels\":[\"automation\",\"repo-assist\"],\"target\":\"*\"},\"remove_labels\":{\"allowed\":[\"bug\",\"documentation\",\"duplicate\",\"enhancement\",\"good first issue\",\"help wanted\",\"invalid\",\"question\",\"wontfix\",\"needs-triage\",\"needs-info\",\"ready-for-agent\",\"ready-for-human\"],\"max\":5,\"target\":\"*\"},\"report_incomplete\":{},\"update_issue\":{\"allow_body\":true,\"footer\":false,\"max\":2,\"required_labels\":[\"repo-assist\"],\"required_title_prefix\":\"[repo-assist] \",\"target\":\"*\"}}"
          GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_ASSIST_GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.REPO_ASSIST_GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
            /tmp/gh-aw/safe-output-errors.json
          if-no-files-found: ignore

  validate_updates:
    name: Verify Repo Assist PR ownership
    needs: agent
    if: needs.agent.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Download proposed outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/repo-assist-review
          pattern: "{agent,agent-output-fallback}"
      - name: Reject updates to nonautomation PRs
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          repository = os.environ["GITHUB_REPOSITORY"]
          current_month = datetime.now(ZoneInfo("Australia/Melbourne")).strftime("%Y-%m")

          def owns_pr(pr: dict) -> bool:
              head = pr.get("head", {})
              head_repo = head.get("repo") or {}
              labels = {label["name"] for label in pr.get("labels", [])}
              return (
                  head_repo.get("full_name", "").lower() == repository.lower()
                  and head.get("ref", "").startswith("repo-assist/")
                  and "[repo-assist]" in pr.get("title", "")
                  and {"automation", "repo-assist"} <= labels
              )

          def validate_memory(body: str) -> None:
              def reject_constant(value: str) -> None:
                  raise ValueError(f"Nonstandard JSON constant: {value}")

              fence = chr(96) * 3
              blocks = re.findall(rf"^{fence}json[ \t]*\r?\n(.*?)\r?\n{fence}[ \t]*$", body, re.M | re.S)
              if len(blocks) != 1 or len(re.findall(r"(?m)^[ \t]*" + fence, body)) != 2:
                  raise ValueError("Memory requires one complete JSON block")
              memory = json.loads(blocks[0], parse_constant=reject_constant)
              fields = {
                  "cursor_issue_number": int, "comments_made": dict, "fix_attempts": dict,
                  "ideas_submitted": list, "labelled": dict, "nudged_prs": dict,
                  "checked_off_actions": list, "todo": list, "notes": list,
              }
              if not isinstance(memory, dict) or any(
                  type(memory.get(key)) is not expected for key, expected in fields.items()
              ):
                  raise ValueError("Memory requires the documented fields and types")
              if memory["cursor_issue_number"] < 0:
                  raise ValueError("Memory cursor must be nonnegative")

          output = json.loads(Path(os.environ["REPO_ASSIST_OUTPUT"]).read_text())
          if not isinstance(output, dict) or not isinstance(output.get("items"), list):
              raise ValueError("Missing proposed output list")
          external_pr_comments = 0
          run_started_at = None
          updated_issues: set[int] = set()
          created_state_titles: set[str] = set()
          existing_state_titles = None
          for item in output["items"]:
              if not isinstance(item, dict):
                  raise ValueError("Invalid proposed output")
              if "@claude" in str(item.get("body", "")).lower():
                  raise ValueError("Published text must not invoke the privileged Claude workflow")
              if item.get("type") == "create_pull_request":
                  labels = item.get("labels", [])
                  if not isinstance(labels, list) or any(
                      label not in ("automation", "repo-assist") for label in labels
                  ):
                      raise ValueError("New PR labels are limited to automation and repo-assist")
              if item.get("type") == "create_issue":
                  title = item.get("title", "").strip()
                  if not title.startswith("[repo-assist] "):
                      title = "[repo-assist] " + title
                  if title == "[repo-assist] Memory":
                      validate_memory(item.get("body", ""))
                  if title == "[repo-assist] Memory" or re.fullmatch(
                      r"\[repo-assist\] Monthly Activity [0-9]{4}-(0[1-9]|1[0-2])", title,
                  ):
                      if title != "[repo-assist] Memory" and title[-7:] != current_month:
                          raise ValueError("New monthly reports must use the current Melbourne month")
                      if existing_state_titles is None:
                          response = subprocess.run(
                              ["gh", "api", "--paginate", "--slurp",
                               f"repos/{repository}/issues?state=all&per_page=100"],
                              check=True, capture_output=True, text=True, timeout=30,
                          )
                          existing_state_titles = {
                              issue["title"] for page in json.loads(response.stdout)
                              for issue in page if "pull_request" not in issue
                          }
                      if title in created_state_titles or title in existing_state_titles:
                          raise ValueError("State issue already exists; do not create a duplicate")
                      created_state_titles.add(title)
              if item.get("type") in {"close_issue", "update_issue"}:
                  if item["type"] == "close_issue":
                      allowed = {
                          "type", "issue_number", "repo", "state_reason",
                          "rationale", "confidence", "body",
                      }
                      if set(item) - allowed:
                          raise ValueError("Report closures contain unsupported fields")
                      if item.get("state_reason", "completed") != "completed":
                          raise ValueError("Reports may only be closed as completed")
                      if not isinstance(item.get("body"), str) or not item["body"].strip():
                          raise ValueError("Closing reports requires a nonblank string body")
                  if item["type"] == "update_issue":
                      allowed = {"type", "issue_number", "repo", "body", "operation"}
                      if set(item) - allowed or not isinstance(item.get("body"), str):
                          raise ValueError("State updates may only replace a string body")
                      if item.get("operation") != "replace":
                          raise ValueError("State updates require operation replace")
                  number = str(item.get("issue_number", ""))
                  if not number.isdecimal() or int(number) < 1:
                      raise ValueError("State updates require an existing issue number")
                  if item["type"] == "update_issue":
                      if int(number) in updated_issues:
                          raise ValueError("Each state issue may be replaced only once per run")
                      updated_issues.add(int(number))
                  if item.get("repo", repository).lower() != repository.lower():
                      raise ValueError("Cross-repository state updates are not allowed")
                  response = subprocess.run(
                      ["gh", "api", f"repos/{repository}/issues/{int(number)}"],
                      check=True, capture_output=True, text=True, timeout=30,
                  )
                  issue = json.loads(response.stdout)
                  labels = {label["name"] for label in issue.get("labels", [])}
                  if (
                      "pull_request" in issue
                      or issue.get("state") != "open"
                      or not (
                          re.fullmatch(
                              r"\[repo-assist\] Monthly Activity [0-9]{4}-(0[1-9]|1[0-2])",
                              issue.get("title", ""),
                          )
                          or (item["type"] == "update_issue" and issue.get("title") == "[repo-assist] Memory")
                      )
                      or "repo-assist" not in labels
                      or issue.get("user", {}).get("login") != os.environ["REPO_ASSIST_PUBLISHER"]
                      or "<!-- gh-aw-workflow-id: repo-assist -->" not in (issue.get("body") or "")
                  ):
                      raise ValueError(f"Issue #{number} is not recorded Repo Assist state")
                  if item["type"] == "update_issue" and issue["title"] == "[repo-assist] Memory":
                      validate_memory(item["body"])
                  elif item["type"] == "update_issue" and issue["title"][-7:] != current_month:
                      raise ValueError("Report replacements require the current Melbourne month")
                  if item["type"] in {"update_issue", "close_issue"}:
                      if run_started_at is None:
                          run_id = os.environ["GITHUB_RUN_ID"]
                          response = subprocess.run(
                              ["gh", "api", f"repos/{repository}/actions/runs/{run_id}"],
                              check=True, capture_output=True, text=True, timeout=30,
                          )
                          run_started_at = datetime.fromisoformat(
                              json.loads(response.stdout)["run_started_at"]
                          )
                      updated_at = datetime.fromisoformat(issue["updated_at"])
                      if updated_at >= run_started_at:
                          raise ValueError("State changed during this run; preserve it for the next run")
                  if item["type"] == "close_issue" and issue["title"][-7:] >= current_month:
                      raise ValueError("Only reports from previous Melbourne months may close")
              if item.get("type") in {"add_comment", "add_labels", "remove_labels"}:
                  is_comment = item["type"] == "add_comment"
                  allowed = {"type", "item_number", "repo"}
                  allowed |= {"body", "temporary_id"} if is_comment else {"labels"}
                  if set(item) - allowed:
                      raise ValueError("Comments and labels require an unambiguous item_number")
                  number = str(item.get("item_number", ""))
                  if not number.isdecimal() or int(number) < 1:
                      raise ValueError("Comments and labels require an existing positive item_number")
                  if item.get("repo", repository).lower() != repository.lower():
                      raise ValueError("Cross-repository comments and labels are not allowed")
                  response = subprocess.run(
                      ["gh", "api", f"repos/{repository}/issues/{int(number)}"],
                      check=True, capture_output=True, text=True, timeout=30,
                  )
                  issue = json.loads(response.stdout)
                  if issue.get("state") != "open":
                      raise ValueError("Comments and labels require an open target")
                  if "pull_request" in issue:
                      if not is_comment:
                          raise ValueError("Label changes may only target issues")
                      response = subprocess.run(
                          ["gh", "api", f"repos/{repository}/pulls/{int(number)}"],
                          check=True, capture_output=True, text=True, timeout=30,
                      )
                      if not owns_pr(json.loads(response.stdout)):
                          external_pr_comments += 1
                          if external_pr_comments > 3:
                              raise ValueError("At most three comments may target non-Repo-Assist PRs")
              if item.get("type") == "create_pull_request":
                  if "[repo-assist]" not in item.get("title", ""):
                      raise ValueError("New PR titles require the Repo Assist marker")
              if item.get("type") in {"create_issue", "update_issue"}:
                  if len(item.get("body", "")) > 60000:
                      raise ValueError("Issue bodies must be compacted below 60000 characters")
              if item.get("type") != "push_to_pull_request_branch":
                  continue
              number = str(item.get("pull_request_number", ""))
              if not number.isdecimal() or int(number) < 1:
                  raise ValueError("PR updates require an existing positive PR number")
              if item.get("repo", repository).lower() != repository.lower():
                  raise ValueError("Cross-repository PR updates are not allowed")
              response = subprocess.run(
                  ["gh", "api", f"repos/{repository}/pulls/{int(number)}"],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              pr = json.loads(response.stdout)
              if not owns_pr(pr):
                  raise ValueError(f"PR #{number} is not a Repo Assist-owned branch")
              response = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp",
                   f"repos/{repository}/pulls/{int(number)}/files?per_page=100"],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              files = [file for page in json.loads(response.stdout) for file in page]
              if not files or len(files) != pr.get("changed_files"):
                  raise ValueError("Could not verify the complete existing PR diff")
              for file in files:
                  for path in (file["filename"], file.get("previous_filename")):
                      if path is not None and path not in ("README.md", "CHANGELOG.md") and not re.fullmatch(
                          r"docs/(?:[^/]+/)*[^/]+\.md", path,
                      ):
                          raise ValueError("Existing PR includes nondocumentation changes")
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ASSIST_OUTPUT: ${{ runner.temp }}/repo-assist-review/agent_output.json
          REPO_ASSIST_PUBLISHER: Artic0din
      - name: Detect PR publishing requests
        id: pr_scan
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          items = json.loads(Path(os.environ["REPO_ASSIST_OUTPUT"]).read_text())["items"]
          required = any(
              item.get("type") in {"create_pull_request", "push_to_pull_request_branch"}
              for item in items
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required={str(required).lower()}\n")
          PY
        env:
          REPO_ASSIST_OUTPUT: ${{ runner.temp }}/repo-assist-review/agent_output.json
      - name: Set up trusted scanner Go
        if: steps.pr_scan.outputs.required == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.26"
      - name: Check out trusted scan base
        if: steps.pr_scan.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: repo-assist-scan-base
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Scan proposed PR artifacts
        if: steps.pr_scan.outputs.required == 'true'
        run: |
          export GOBIN="$RUNNER_TEMP/repo-assist-scan-tools"
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          checkout = os.environ["REPO_ASSIST_SCAN_BASE"]
          scanner = str(Path(os.environ["GOBIN"]) / "gitleaks")
          artifacts = Path(os.environ["REPO_ASSIST_ARTIFACTS"])
          bundles = list(artifacts.glob("aw-*.bundle"))
          if not bundles or any(
              not patch.with_suffix(".bundle").is_file()
              for patch in artifacts.glob("aw-*.patch")
          ):
              raise ValueError("PR publishing requires complete Git bundle transport")
          revisions = set()
          with tempfile.TemporaryDirectory(prefix="repo-assist-publish-") as directory:
              payload = Path(directory)
              shutil.copyfile(artifacts / "agent_output.json", payload / "agent_output.json")
              for bundle in bundles:
                  result = subprocess.run(
                      ["git", "-C", checkout, "bundle", "unbundle", str(bundle)],
                      check=True, capture_output=True, text=True,
                  )
                  if not result.stdout.strip():
                      raise ValueError("Bundle has no advertised revisions")
                  for line in result.stdout.splitlines():
                      fields = line.split()
                      if not fields or not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", fields[0]):
                          raise ValueError("Invalid bundle revision")
                      revisions.add(fields[0])
              for index, revision in enumerate(sorted(revisions)):
                  metadata = subprocess.run(
                      ["git", "-C", checkout, "log", "--format=raw", "--raw", "--no-renames",
                       revision, "--not", "--all"],
                      check=True, capture_output=True,
                  )
                  (payload / f"commit-{index}.txt").write_bytes(metadata.stdout)
              subprocess.run(
                  [scanner, "dir", directory, "--redact", "--ignore-gitleaks-allow"],
                  check=True,
              )
          for revision in sorted(revisions):
              subprocess.run(
                  [scanner, "git", checkout, "--redact", "--ignore-gitleaks-allow",
                   "--log-opts", f"{revision} --not --all --diff-merges=first-parent"],
                  check=True,
              )
          PY
        env:
          REPO_ASSIST_ARTIFACTS: ${{ runner.temp }}/repo-assist-review
          REPO_ASSIST_SCAN_BASE: ${{ github.workspace }}/repo-assist-scan-base
